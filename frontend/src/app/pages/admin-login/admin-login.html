<div class="login-page">

  <div class="login-image">
    <div class="image-content">
      <span class="brand">YATRIVA.</span>
      <h1>Every journey<br>begins somewhere.</h1>
      <p>Manage journeys. Create experiences. Make every trip memorable.</p>
    </div>
  </div>

  <div class="login-section">

    <a routerLink="/" class="back-home">← Back to website</a>

    <div class="login-card">

      <span class="small-heading">ADMINISTRATION</span>

      <h2>Welcome back</h2>

      <p class="subtitle">
        Sign in to manage your travel enquiries.
      </p>

      <form (ngSubmit)="login()" #loginForm="ngForm">

        <div class="form-group">
          <label>Username</label>

          <input
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter your username"
            required
          >
        </div>

        <div class="form-group">
          <label>Password</label>

          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <p class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </p>

        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Signing in...' : 'Sign in' }}
        </button>

      </form>

      <p class="login-footer">
        Yatriva Admin Portal
      </p>

    </div>

  </div>

</div>
